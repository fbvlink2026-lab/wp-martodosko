name: Build WP Martodosko APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Kunin ang Code
        uses: actions/checkout@v4

      - name: ☕ I-setup ang Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 I-setup ang Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew — GAGAWIN NATIN"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: 🔨 Bumuo ng APK
        run: ./gradlew assembleDebug

      - name: 📤 I-upload ang APK
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-v1.0
          path: app/build/outputs/apk/debug/app-debug.apk
