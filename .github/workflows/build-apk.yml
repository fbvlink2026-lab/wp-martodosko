name: Build APK — wp-martodosko
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "gradlew found"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "gradlew NOT found"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"
          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "BUILD FAILED - Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      - name: Write errors.html
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.html"
          mkdir -p "$ASSETS_DIR"
          rm -f "$TARGET_FILE"
          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="SUCCESS"
            STATUS_DETAIL="APK built successfully"
          else
            STATUS_DISPLAY="FAILED"
            STATUS_DETAIL="APK build failed - check log below"
          fi
          cat > "$TARGET_FILE" << HTMLEND
<!DOCTYPE html>
<html>
<head><meta charset=utf-8><title>Build Result</title></head>
<body>
<h1>Build Result - WP Martodosko</h1>
<p>Date: $DATE</p>
<p>Status: $STATUS_DISPLAY</p>
<p>Detail: $STATUS_DETAIL</p>
<pre>
HTMLEND
          if [ -f "$LOG_FILE" ]; then cat "$LOG_FILE"; fi
          echo "</pre></body></html>" >> "$TARGET_FILE"
          echo "errors.html written successfully"

      - name: Copy assets to docs - KEEP wordpress
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"
          TEMP_DIR="/tmp/docs-backup"
          mkdir -p "$TEMP_DIR"
          if [ -d "$DOCS_DIR/wordpress" ]; then
            cp -R "$DOCS_DIR/wordpress" "$TEMP_DIR/"
            echo "Backed up wordpress folder"
          fi
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"
          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/" 2>/dev/null || true
          if [ -d "$TEMP_DIR/wordpress" ]; then
            cp -R "$TEMP_DIR/wordpress" "$DOCS_DIR/"
            echo "Restored wordpress folder"
          fi
          ls -la "$DOCS_DIR/"

      - name: Find and prepare APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "docs/WP-Martodosko-v1.0.apk"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK prepared"
          else
            echo "APK_FOUND=false" >> $GITHUB_ENV
            echo "APK NOT FOUND"
          fi

      - name: Upload APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      - name: Commit and Push
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "Build Result: $(date +%Y-%m-%d %H:%M)"
            git push
          fi

      - name: Final Result
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
