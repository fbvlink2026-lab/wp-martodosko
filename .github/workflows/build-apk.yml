name: Build APK — wp-martodosko
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: \${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> \$GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> \$GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:\$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 BUUIN ANG APK
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"
          set +e
          ./gradlew assembleDebug > "\$LOG_FILE" 2>&1
          EXIT_CODE=\$?
          set -e
          if [ \$EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "\$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "\$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: \$EXIT_CODE"
          fi
          echo "EXIT_CODE=\$EXIT_CODE" >> \$GITHUB_ENV

      # ==========================================
      # 📄 errors.html
      # ==========================================
      - name: 📄 Burahin Luma → Isulat BAGONG errors.html
        id: write-log
        if: always()
        run: |
          DATE=\$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="\$ASSETS_DIR/errors.html"
          mkdir -p "\$ASSETS_DIR"
          rm -f "\$TARGET_FILE"
          if [ -f "\$STATUS_FILE" ] && [ "\$(cat \$STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang WP Martodosko APK"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
          fi
          {
            echo "# 📋 Talaan ng Pagbuo — WP Martodosko"
            echo ""
            echo "📅 **Petsa:** \$DATE"
            echo "🎯 **Katayuan:** \$STATUS_DISPLAY"
            echo "📝 **Detalye:** \$STATUS_DETAIL"
            echo "## 📋 Buong Log"
            echo "\`\`\`"
            [ -f "\$LOG_FILE" ] && cat "\$LOG_FILE" || echo "(Walang log)"
            echo "\`\`\`"
          } > "\$TARGET_FILE"
          echo "✅ errors.html naisulat"

      # ==========================================
      # 📤 KOPYAHIN assets/ → docs/ — HUWAG BURAHIN docs/wordpress/ ✅
      # ==========================================
      - name: 📤 Kopyahin Assets — HUWAG BURAHIN docs/wordpress/
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"
          TEMP_DIR="/tmp/docs-backup"
          mkdir -p "\$TEMP_DIR"
          [ -d "\$DOCS_DIR/wordpress" ] && cp -R "\$DOCS_DIR/wordpress" "\$TEMP_DIR/" && echo "✅ NAKABACKUP docs/wordpress/"
          find "\$DOCS_DIR" -mindepth 1 -maxdepth 1 ! -name 'wordpress' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p "\$DOCS_DIR"
          cp -R "\$ASSETS_DIR"/. "\$DOCS_DIR/" 2>/dev/null || true
          [ -d "\$TEMP_DIR/wordpress" ] && cp -R "\$TEMP_DIR/wordpress" "\$DOCS_DIR/" && echo "✅ NABALIK docs/wordpress/"
          ls -la "\$DOCS_DIR/"

      # ==========================================
      # 📤 HANAPIN ANG APK
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=\$(find . -name "app-debug.apk" -path "*/build/*" | head -1)
          if [ -n "\$APK_FILE" ] && [ -f "\$APK_FILE" ]; then
            APK_SIZE=\$(du -h "\$APK_FILE" | cut -f1)
            cp "\$APK_FILE" "docs/WP-Martodosko-v1.0.apk"
            echo "✅ APK MATAGPUAN"
            echo "APK_FOUND=true" >> \$GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> \$GITHUB_ENV
          fi

      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      - name: ✅ I-commit at I-push
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/ docs/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "📋 Build Result: \$(date +%Y-%m-%d %H:%M)"
            git push || git push --force
          fi

      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "\${{ env.APK_FOUND }}" = "true" ]; then
            echo "STATUS=SUCCESS" >> \$GITHUB_OUTPUT
          else
            echo "STATUS=FAILED" >> \$GITHUB_OUTPUT
            exit 1
          fi
