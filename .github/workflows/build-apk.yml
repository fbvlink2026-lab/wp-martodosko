name: Build APK — wp-martodosko
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew — GAGAWIN"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      - name: 📄 Gumawa ng errors.html sa docs/
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          TARGET_FILE="docs/errors.html"

          mkdir -p docs

          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang WP Martodosko APK"
            BADGE_CLASS="ok"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
            BADGE_CLASS="err"
          fi

          cat > "$TARGET_FILE" << HTMLEND
<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build — WP Martodosko</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}
    body{background:#f0f2f5;padding:20px;max-width:900px;margin:0 auto}
    .card{background:#fff;border-radius:12px;padding:24px;margin-bottom:16px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
    h1{font-size:22px;margin-bottom:12px}
    .badge{display:inline-block;padding:8px 22px;border-radius:50px;color:#fff;font-weight:bold;font-size:16px}
    .ok{background:#22c55e}
    .err{background:#ef4444}
    pre{background:#1e293b;color:#f8fafc;padding:16px;border-radius:8px;font:13px 'Courier New',monospace;line-height:1.6;overflow-x:auto;margin-top:10px}
    .e-line{color:#fca5a5;background:#450a0a;padding:2px 8px;border-radius:4px;display:block;margin:2px 0}
    .label{font-weight:600;margin:18px 0 8px;color:#374151}
  </style>
</head>
<body>
  <div class="card">
    <h1>Build — WP Martodosko</h1>
    <span class="badge $BADGE_CLASS">$STATUS_DISPLAY</span>
    <p class="label">📅 Petsa: $DATE</p>
    <p class="label">📝 Detalye: $STATUS_DETAIL</p>
  </div>
HTMLEND

          if [ "$STATUS_DISPLAY" = "❌ NABIGO" ]; then
            echo '  <div class="card"><p class="label">🔍 Mga Error:</p><pre>' >> "$TARGET_FILE"
            grep -n -i "error\|failed\|exception\|cannot\|unable" "$LOG_FILE" | head -35 | while read -r L; do
              echo "<span class='e-line'>$L</span>" >> "$TARGET_FILE"
            done
            echo '</pre></div>' >> "$TARGET_FILE"
          fi

          echo '  <div class="card"><p class="label">📋 Buong Log:</p><pre>' >> "$TARGET_FILE"
          sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$LOG_FILE" >> "$TARGET_FILE"
          echo '</pre></div></body></html>' >> "$TARGET_FILE"

          echo "✅ NAKASAVE SA: $TARGET_FILE"

      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        if: env.EXIT_CODE == '0'
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            NEW_NAME="WP-Martodosko-v1.0.apk"
            cp "$APK_FILE" "docs/$NEW_NAME"
            echo "✅ APK MATAGPUAN: docs/$NEW_NAME ($APK_SIZE)"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      - name: ✅ I-commit ang docs/ folder
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "📄 Build status: $(date +%Y-%m-%d %H:%M)" || true
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.EXIT_CODE }}" = "0" ]; then
            echo "✅ TAGUMPAY — APK Nabuo!"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — Tingnan ang docs/errors.html"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
