name: Build APK — wp-martodosko
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==============================================
      # ✅ BAGO — KUMUHA NG WORDPRESS → assets/wordpress/
      # ==============================================
      - name: 📦 Ihanda ang WordPress sa assets/
        run: |
          ASSETS_DIR="app/src/main/assets/wordpress"
          mkdir -p "$ASSETS_DIR"

          echo "📥 Dinadownload ang WordPress..."
          wget -q https://wordpress.org/latest.zip -O /tmp/wordpress.zip
          unzip -q /tmp/wordpress.zip -d /tmp

          echo "📂 Kinokopya papunta sa assets/wordpress..."
          cp -r /tmp/wordpress/* "$ASSETS_DIR"/

          # ✅ Simpleng wp-config.php — handa na
          cat > "$ASSETS_DIR/wp-config.php" << 'WPCFG'
<?php
define( 'DB_NAME', 'wp_db' );
define( 'DB_USER', 'root' );
define( 'DB_PASSWORD', '' );
define( 'DB_HOST', 'localhost' );
define( 'DB_CHARSET', 'utf8mb4' );
define( 'DB_COLLATE', '' );
$table_prefix = 'wp_';
define( 'WP_DEBUG', false );
define( 'WP_SITEURL', 'file:///android_asset/wordpress' );
define( 'WP_HOME', 'file:///android_asset/wordpress' );
if ( ! defined( 'ABSPATH' ) ) define( 'ABSPATH', __DIR__ . '/' );
require_once ABSPATH . 'wp-settings.php';
WPCFG

          echo "✅ WordPress nakalagay sa assets/wordpress/"
          ls -la "$ASSETS_DIR"

      # ==============================================
      # ✅ BAGO — I-UPDATE ANG MainActivity.java → buksan ang lokal na WordPress
      # ==============================================
      - name: 📄 I-update ang MainActivity — buksan ang WordPress mula sa assets
        run: |
          mkdir -p app/src/main/java/com/martodosko/wp
          cat > app/src/main/java/com/martodosko/wp/MainActivity.java << 'JAVA'
package com.martodosko.wp;

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);

        webView = findViewById(R.id.webview);
        WebSettings settings = webView.getSettings();
        
        settings.setJavaScriptEnabled(true);
        settings.setDomStorageEnabled(true);
        settings.setAllowFileAccess(true);
        settings.setAllowContentAccess(true);

        webView.setWebViewClient(new WebViewClient());

        // ✅ Buksan ang WordPress mula sa loob ng APK — WALANG KAILANGANG INTERNET!
        webView.loadUrl("file:///android_asset/wordpress/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) {
            webView.goBack();
        } else {
            super.onBackPressed();
        }
    }
}
JAVA
          echo "✅ MainActivity updated — binabasa mula sa assets/wordpress"

      # ⚡ KUNG MAYROON NANG gradlew — DERETSO NA LANG
      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 HAKBANG 1 — BUUIN ANG APK ✅ GANOON PA RIN
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      # ==========================================
      # 📄 HAKBANG 2 — errors.html ✅ GANOON PA RIN
      # ==========================================
      - name: 📄 Burahin Luma → Isulat BAGONG errors.html sa assets/
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.html"

          mkdir -p "$ASSETS_DIR"

          if [ -f "$TARGET_FILE" ]; then
            rm -f "$TARGET_FILE"
            echo "🗑️ BINURA ANG LUMANG errors.html"
          fi

          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang WP Martodosko APK — may WordPress na sa loob!"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang log sa ibaba"
          fi

          {
            echo "# 📋 Talaan ng Pagbuo — WP Martodosko"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🎯 **Katayuan:** $STATUS_DISPLAY"
            echo "📝 **Detalye:** $STATUS_DETAIL"
            echo "---"
            echo ""
            echo "## 📋 Buong Log ng Pagbuo"
            echo "\`\`\`"
            if [ -f "$LOG_FILE" ]; then
              cat "$LOG_FILE"
            else
              echo "(Walang nakuhang log)"
            fi
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TARGET_FILE"

          echo "✅ BAGONG errors.html NAISULAT SA: $TARGET_FILE"

      # ==========================================
      # 📤 HAKBANG 3 — KOPYAHIN BUONG assets/ → docs/ ✅ GANOON PA RIN
      # ==========================================
      - name: 📤 Kopyahin BUONG Assets papunta sa /docs
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"

          echo "=== 📂 LAMAN NG assets/ BAGO KOPYAHIN ==="
          ls -la "$ASSETS_DIR"
          echo ""

          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"

          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/"

          echo ""
          echo "=== ✅ LAMAN NG docs/ ==="
          ls -la "$DOCS_DIR"

          if [ -f "$DOCS_DIR/errors.html" ]; then
            echo "✅✅✅ BAGONG errors.html NAKOPYA — SIGURADO!"
          fi

      # ==========================================
      # 📤 HAKBANG 4 — ILAGAY ANG APK SA docs/ ✅ GANOON PA RIN
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            NEW_NAME="WP-Martodosko-v1.0.apk"

            cp "$APK_FILE" "docs/$NEW_NAME"

            echo "✅ APK MATAGPUAN: docs/$NEW_NAME ($APK_SIZE)"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # ✅ I-UPLOAD ANG APK ✅ GANOON PA RIN
      # ==========================================
      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT ✅ GANOON PA RIN
      # ==========================================
      - name: ✅ I-commit at I-push ang LAHAT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/ docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ WALANG PAGBABAGO"
          else
            git commit -m "📋 Build Result: $(date +%Y-%m-%d %H:%M)"
            git push || git push --force
            echo "✅ MATAGUMPAY — SABAY-SABAY ANG LAHAT!"
          fi

      # ==========================================
      # ✅ KONKLUSYON ✅ GANOON PA RIN
      # ==========================================
      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "✅ TAGUMPAY — May APK, nakopya ang assets + WordPress"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — WALANG APK DAHIL MAY ERROR SA BUILD"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
