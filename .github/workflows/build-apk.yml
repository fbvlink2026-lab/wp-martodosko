name: Build APK — wp-martodosko
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "gradlew found"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "gradlew NOT found"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"
          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
          else
            echo "FAILED" > "$STATUS_FILE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      - name: Write errors.html
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.html"
          mkdir -p "$ASSETS_DIR"
          echo "<html><head><meta charset=utf-8><title>Build Result</title></head><body>" > "$TARGET_FILE"
          echo "<h1>Build Result</h1><p>Date: $DATE</p>" >> "$TARGET_FILE"
          echo "<p>Status: ${{ steps.build-step.outcome }}</p>" >> "$TARGET_FILE"
          echo "</body></html>" >> "$TARGET_FILE"

      # ==========================================================
      # 🛡️  PINAKA MAHALAGA: HINDI MABUBURA ANG docs/ — LAHAT LIGTAS!
      # ==========================================================
      - name: 🛡️ PROTECT — Kopyahin APK lang, HINDI BURAHIN ANG docs/
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"
          BACKUP="/tmp/docs-FULL-backup"

          # 💾 I-BACKUP ANG BUONG docs/ — LAHAT!
          mkdir -p "$BACKUP"
          cp -R "$DOCS_DIR"/. "$BACKUP/"
          echo "✅ NAI-BACKUP ANG BUONG docs/ — WALANG MAWALA!"

          # 🧹 HUWAG BURAHIN — KOPYAHIN LANG ANG KAILANGAN!
          # ✅ APK lang ang ilalagay — HINDI GAGALAWIN ANG IBA PANG FILE SA docs/

          # 📤 KOPYAHIN ANG errors.html MULA ASSETS → docs/
          cp "$ASSETS_DIR/errors.html" "$DOCS_DIR/" 2>/dev/null || true

          # 🔄 IBALIK ANG LAHAT MULA SA BACKUP — SIGURADONG WALANG NABURA!
          cp -R "$BACKUP"/. "$DOCS_DIR/"
          echo "✅ LAHAT SA docs/ — NABALIK AT HINDI NABURA!"

          ls -la "$DOCS_DIR/"

      - name: Find APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "docs/WP-Martodosko-v1.0.apk"
            echo "✅ APK inilagay sa docs/"
            echo "APK_FOUND=true" >> $GITHUB_ENV
          else
            echo "❌ APK hindi matagpuan"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      - name: Upload APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      - name: Commit & Push
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "Build: $(date +%Y-%m-%d %H:%M)"
            git push origin main
          fi

      - name: Final Status
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
