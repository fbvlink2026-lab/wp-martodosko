name: Build APK — wp-martodosko
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ==============================================
      # 🆕 HAKBANG A — I-download ang WordPress → assets/wordpress
      # ==============================================
      - name: 📦 Ihanda ang WordPress sa assets/
        run: |
          ASSETS_DIR="app/src/main/assets/wordpress"
          mkdir -p "$ASSETS_DIR"
          echo "📥 Dinadownload ang WordPress..."
          wget -q https://wordpress.org/latest.zip -O /tmp/wp.zip
          unzip -q /tmp/wp.zip -d /tmp
          echo "📂 Kinokopya papunta sa assets/wordpress..."
          cp -r /tmp/wordpress/* "$ASSETS_DIR"/
          echo "✅ WordPress nakalagay — $(ls -1 "$ASSETS_DIR" | wc -l) files/folders"

      # ==============================================
      # 🆕 HAKBANG B — I-update ang MainActivity → buksan lokal na WordPress
      # ==============================================
      - name: 📄 I-update ang MainActivity — binabasa mula sa assets
        run: |
          DST="app/src/main/java/com/martodosko/wp/MainActivity.java"
          mkdir -p "$(dirname "$DST")"
          cat > "$DST" << 'JAVA'
package com.martodosko.wp;

import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        setContentView(R.layout.activity_main);
        webView = findViewById(R.id.webview);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setAllowFileAccess(true);
        webView.loadUrl("file:///android_asset/wordpress/index.html");
    }

    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
JAVA
          echo "✅ MainActivity updated — binabasa mula sa assets/wordpress"

      # ==============================================
      # ⬇️ MULA DITO — GANOON PA RIN, WALANG BINAGO! ⬇️
      # ==============================================

      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"
          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
          else
            echo "FAILED" > "$STATUS_FILE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      - name: 📄 Burahin Luma → Isulat BAGONG errors.html
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.html"
          mkdir -p "$ASSETS_DIR"
          [ -f "$TARGET_FILE" ] && rm -f "$TARGET_FILE"
          if [ -f "$STATUS_FILE" ] && [ "$(cat "$STATUS_FILE")" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo — may WordPress na sa loob!"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK"
          fi
          {
            echo "# 📋 Talaan ng Pagbuo — WP Martodosko"
            echo ""
            echo "---"
            echo "📅 **Petsa:** $DATE"
            echo "🎯 **Katayuan:** $STATUS_DISPLAY"
            echo "📝 **Detalye:** $STATUS_DETAIL"
            echo "---"
            echo ""
            echo "## 📋 Buong Log ng Pagbuo"
            echo "\`\`\`"
            [ -f "$LOG_FILE" ] && cat "$LOG_FILE" || echo "(Walang log)"
            echo "\`\`\`"
            echo ""
            echo "---"
            echo "✅ **Katapusan ng Talaan**"
          } > "$TARGET_FILE"

      - name: 📤 Kopyahin BUONG Assets papunta sa /docs
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"
          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/"

      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            NEW_NAME="WP-Martodosko-v1.0.apk"
            cp "$APK_FILE" "docs/$NEW_NAME"
            echo "APK_FOUND=true" >> $GITHUB_ENV
          else
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      - name: ✅ I-commit at I-push ang LAHAT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/ docs/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "📋 Build: WordPress in assets" || true
            git push || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
