name: Build APK — wp-martodosko
on:
  push: { branches: [main] }
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      build_status: ${{ steps.final-result.outputs.STATUS }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ⚡ KUNG MAYROON NANG gradlew — DERETSO NA LANG
      - name: ⚡ Check Gradle Wrapper
        id: wrapper-check
        run: |
          if [ -f "./gradlew" ] && [ -x "./gradlew" ]; then
            echo "✅ gradlew NANDOON NA"
            echo "HAS_WRAPPER=true" >> $GITHUB_ENV
          else
            echo "⚠️ WALANG gradlew"
            echo "HAS_WRAPPER=false" >> $GITHUB_ENV
          fi

      - name: Setup Gradle 8.2 (KUNG KULANG LANG)
        if: env.HAS_WRAPPER == 'false'
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          export PATH=/tmp/gradle-8.2/bin:$PATH
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew

      - name: Siguraduhing Pwede ang gradlew
        run: chmod +x ./gradlew 2>/dev/null || true

      # ==========================================
      # 🔨 HAKBANG 1 — BUUIN ANG APK ✅ ITUTULOY KAHIT MAY ERROR
      # ==========================================
      - name: 🔨 Buuin ang APK
        id: build-step
        run: |
          mkdir -p /tmp
          LOG_FILE="/tmp/build-full.log"
          STATUS_FILE="/tmp/build-status.txt"

          set +e
          ./gradlew assembleDebug > "$LOG_FILE" 2>&1
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "SUCCESS" > "$STATUS_FILE"
            echo "✅ BUILD SUCCESSFUL"
          else
            echo "FAILED" > "$STATUS_FILE"
            echo "❌ BUILD FAILED — Exit Code: $EXIT_CODE"
          fi
          echo "EXIT_CODE=$EXIT_CODE" >> $GITHUB_ENV

      # ==========================================
      # 📄 HAKBANG 2 — GUMAGAWA NG MAGANDANG errors.html ✨
      # ==========================================
      - name: 📄 Burahin Luma → Isulat BAGONG errors.html sa assets/
        id: write-log
        if: always()
        run: |
          DATE=$(date "+%Y-%m-%d %H:%M:%S UTC")
          STATUS_FILE="/tmp/build-status.txt"
          LOG_FILE="/tmp/build-full.log"
          ASSETS_DIR="app/src/main/assets"
          TARGET_FILE="$ASSETS_DIR/errors.html"

          mkdir -p "$ASSETS_DIR"

          # ✅ BURAHIN MUNA — SIGURADONG MAY PAGBABAGO
          if [ -f "$TARGET_FILE" ]; then
            rm -f "$TARGET_FILE"
            echo "🗑️ BINURA ANG LUMANG errors.html"
          fi

          # ✅ TUKUYIN ANG KATAYUAN
          if [ -f "$STATUS_FILE" ] && [ "$(cat $STATUS_FILE)" = "SUCCESS" ]; then
            STATUS_DISPLAY="✅ TAGUMPAY"
            STATUS_TEXT="MATAGUMPAY"
            STATUS_DETAIL="Matagumpay na nabuo ang WP Martodosko APK"
            BADGE_COLOR="#10b981"
            CARD_BORDER="#d1fae5"
          else
            STATUS_DISPLAY="❌ NABIGO"
            STATUS_TEXT="NABIGO"
            STATUS_DETAIL="Hindi nabuo ang APK — tingnan ang mga error sa ibaba"
            BADGE_COLOR="#ef4444"
            CARD_BORDER="#fee2e2"
          fi

          # ✅ KUNIN ANG MGA ERROR NA LINYA
          ERROR_LINES=""
          if [ -f "$LOG_FILE" ] && [ "$STATUS_DISPLAY" != "✅ TAGUMPAY" ]; then
            ERROR_LINES=$(grep -n -i "error\|failed\|exception\|cannot\|unable" "$LOG_FILE" | head -35)
          fi

          # ✅ I-ESCAPE ANG BUONG LOG PARA SA HTML
          ESCAPED_LOG=""
          if [ -f "$LOG_FILE" ]; then
            ESCAPED_LOG=$(sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' "$LOG_FILE")
          fi

          # ✅ BUUIN ANG HTML — MAGANDA NA! 🎨
          cat > "$TARGET_FILE" << HTMLEND
<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build Result — WP Martodosko</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      border-left: 6px solid $CARD_BORDER;
    }
    h1 { font-size: 28px; color: #1e293b; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 50px;
      color: white;
      font-weight: 700;
      font-size: 18px;
      margin: 12px 0 20px;
      background: $BADGE_COLOR;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .meta { color: #64748b; font-size: 15px; margin-bottom: 8px; }
    .desc { color: #334155; font-size: 16px; line-height: 1.6; }
    h2 {
      font-size: 18px;
      color: #1e293b;
      margin: 28px 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::before {
      content: '';
      width: 4px;
      height: 18px;
      border-radius: 2px;
      background: $BADGE_COLOR;
      display: inline-block;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 20px;
      border-radius: 12px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.7;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .error-line {
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      padding: 6px 12px;
      border-radius: 6px;
      display: block;
      margin: 4px 0;
      border-left: 3px solid #ef4444;
      font-weight: 500;
    }
    .footer {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>📦 Build — WP Martodosko</h1>
      <div class="badge">$STATUS_TEXT</div>
      <p class="meta">📅 Petsa: $DATE</p>
      <p class="desc">$STATUS_DETAIL</p>
    </div>
HTMLEND

          # ✅ KUNG MAY ERROR — IPAKITA ANG MGA LINYA
          if [ "$STATUS_DISPLAY" != "✅ TAGUMPAY" ] && [ -n "$ERROR_LINES" ]; then
            cat >> "$TARGET_FILE" << ERRSECT
    <div class="card">
      <h2>🔍 Mga Nakitang Error</h2>
      <pre>
ERRSECT
            echo "$ERROR_LINES" | while IFS= read -r LINE; do
              if [ -n "$LINE" ]; then
                echo "<span class='error-line'>$LINE</span>" >> "$TARGET_FILE"
              fi
            done
            echo '</pre></div>' >> "$TARGET_FILE"
          fi

          # ✅ BUONG LOG
          cat >> "$TARGET_FILE" << LOGSECT
    <div class="card">
      <h2>📋 Buong Log ng Pagbuo</h2>
      <pre>$ESCAPED_LOG</pre>
    </div>
    <div class="footer">
      ✅ Talaan ng Pagbuo — WP Martodosko
    </div>
  </div>
</body>
</html>
LOGSECT

          echo "✅ BAGONG errors.html NAISULAT SA: $TARGET_FILE"

      # ==========================================
      # 📤 HAKBANG 3 — KOPYAHIN BUONG assets/ → docs/ ✅ LAGING GAGANA
      # ==========================================
      - name: 📤 Kopyahin BUONG Assets papunta sa /docs
        run: |
          ASSETS_DIR="app/src/main/assets"
          DOCS_DIR="./docs"

          echo "=== 📂 LAMAN NG assets/ BAGO KOPYAHIN ==="
          ls -la "$ASSETS_DIR"
          echo ""

          echo "=== ✅ BURAHIN BUONG docs/ ==="
          rm -rf "$DOCS_DIR"
          mkdir -p "$DOCS_DIR"

          echo "=== 📤 KOPYAHIN BUONG assets/ → docs/ ==="
          cp -R "$ASSETS_DIR"/. "$DOCS_DIR/"

          echo ""
          echo "=== ✅ LAMAN NG docs/ ==="
          ls -la "$DOCS_DIR"

          if [ -f "$DOCS_DIR/errors.html" ]; then
            echo "✅✅✅ BAGONG errors.html NAKOPYA — SIGURADO!"
          fi

      # ==========================================
      # 📤 HAKBANG 4 — ILAGAY ANG APK SA docs/ ✅ KUNG MAYROON
      # ==========================================
      - name: 📤 Hanapin at Ihanda ang APK
        id: apk-step
        run: |
          APK_FILE=$(find . -name "app-debug.apk" -path "*/build/*" | head -1)

          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
            APK_SIZE_BYTES=$(stat -c%s "$APK_FILE")
            NEW_NAME="WP-Martodosko-v1.0.apk"

            cp "$APK_FILE" "docs/$NEW_NAME"

            echo "✅ APK MATAGPUAN: docs/$NEW_NAME"
            echo "APK_FOUND=true" >> $GITHUB_ENV
            echo "APK_SIZE=$APK_SIZE" >> $GITHUB_ENV
            echo "APK_PATH=docs/$NEW_NAME" >> $GITHUB_ENV
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
          else
            echo "❌ HINDI MATAGPUAN ANG APK"
            echo "APK_FOUND=false" >> $GITHUB_ENV
          fi

      # ==========================================
      # ✅ I-UPLOAD ANG APK ✅ KUNG MAYROON
      # ==========================================
      - name: 📤 I-upload ang APK
        if: env.APK_FOUND == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: WP-Martodosko-APK
          path: docs/*.apk
          retention-days: 30

      # ==========================================
      # ✅ I-COMMIT — LAGING GAGANA ✅ KAHIT WALANG APK
      # ==========================================
      - name: ✅ I-commit at I-push ang LAHAT
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add app/src/main/assets/ docs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ WALANG PAGBABAGO"
          else
            git commit -m "📋 Build Result: $(date +%Y-%m-%d %H:%M)"
            echo "📤 IPINAPADALA..."
            git push || git push --force
            echo "✅ MATAGUMPAY — SABAY-SABAY ANG LAHAT!"
          fi

      # ==========================================
      # ✅ KONKLUSYON ✅ NGAYON — PULA ❌ KUNG WALANG APK!
      # ==========================================
      - name: ✅ Resulta ng Pagbuo
        id: final-result
        if: always()
        run: |
          if [ "${{ env.APK_FOUND }}" = "true" ]; then
            echo "✅ TAGUMPAY — May APK, nakopya ang assets"
            echo "STATUS=SUCCESS" >> $GITHUB_OUTPUT
          else
            echo "❌ NABIGO — WALANG APK DAHIL MAY ERROR SA BUILD"
            echo "STATUS=FAILED" >> $GITHUB_OUTPUT
            exit 1
          fi
