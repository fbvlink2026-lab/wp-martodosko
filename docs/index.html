<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP Martodosko</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { background:linear-gradient(135deg,#007cba 0%,#2271b1 100%); min-height:100vh; display:flex; align-items:center; justify-content:center; color:white; text-align:center; padding:20px; }
    .card { background:rgba(255,255,255,0.1); padding:40px 30px; border-radius:12px; backdrop-filter:blur(10px); max-width:400px; width:100%; }
    h1 { font-size:28px; margin-bottom:10px; }
    p { margin-bottom:25px; opacity:0.9; }
    a { display:inline-block; background:white; color:#007cba; padding:12px 30px; border-radius:6px; text-decoration:none; font-weight:600; transition:transform 0.2s; }
    a:hover { transform:scale(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌐 WP Martodosko</h1>
    <p>Website — Parang WordPress sa GitHub Pages</p>
    <a href="pages/admin.html">➡️ Pumunta sa Admin</a>
  </div>
</body>
</html>
