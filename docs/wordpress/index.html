<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="site-title">WP Martodosko</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="header">
    <div class="container">
      <h1 id="logo">🌐 WP Martodosko</h1>
      <nav id="main-nav"></nav>
    </div>
  </header>

  <main class="container">
    <div id="content-area">
      <div class="loading">⏳ Kinukuha ang laman...</div>
    </div>
  </main>

  <footer id="footer">
    <p>&copy; 2026 WP Martodosko — Walang PHP, Walang MySQL</p>
  </footer>

  <script src="js/database.js"></script>
  <script>
    loadDatabase(function(db) {
      renderMenu(db.menus.main);
      renderPosts(db.posts);
      document.getElementById('site-title').textContent = db.site.title;
      document.getElementById('logo').textContent = db.site.title;
    });
  </script>
</body>
</html>
