<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP Martodosko</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f0f4f8; padding: 20px; max-width: 900px; margin: 0 auto; }
    header { background: linear-gradient(135deg, #007cba, #005a87); color: white; padding: 30px; border-radius: 12px; margin-bottom: 25px; }
    h1 { font-size: 28px; }
    .post { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .post h2 { color: #1a1a1a; margin-bottom: 10px; font-size: 20px; }
    .post-meta { color: #777; font-size: 14px; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .post-content { color: #333; line-height: 1.7; font-size: 16px; }
    .loading { text-align: center; padding: 40px; color: #666; }
  </style>
</head>
<body>
  <header>
    <h1>🌐 WP Martodosko</h1>
    <p>Purong HTML + Static Database — Gumagana sa GitHub Pages!</p>
  </header>

  <main id="posts-container">
    <div class="loading">⏳ Kinukuha ang laman mula sa database...</div>
  </main>

  <script>
    fetch('data/posts.json')
      .then(response => response.json())
      .then(posts => {
        const container = document.getElementById('posts-container');
        container.innerHTML = '';
        posts.forEach(post => {
          container.innerHTML += `
            <article class="post">
              <h2>${post.title}</h2>
              <div class="post-meta">📅 ${post.date} | ✍️ ${post.author}</div>
              <div class="post-content">${post.content}</div>
            </article>
          `;
        });
      })
      .catch(err => {
        document.getElementById('posts-container').innerHTML = 
          `<div class="post"><h2>❌ Error</h2><p>${err}</p></div>`;
      });
  </script>
</body>
</html>
