<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — WP Martodosko</title>
  <style id="dynamic-styles"></style>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">🌐 WP Martodosko</div>
    <ul class="menu-list" id="sidebar-menu"><li class="loading">⏳ Binabasa...</li></ul>
  </aside>
  <main class="main-container">
    <div class="content-container" id="admin-content">
      <p class="loading">👈 Pumili ng pahina sa kaliwa...</p>
    </div>
    <div class="editor-pane" id="editor-pane">
      <button class="close-editor" onclick="closeEditor()">×</button>
      <h3 id="editor-title">✏️ Pag-eedit</h3>
      <textarea id="editor-area" placeholder="Ilagay ang laman o code dito..."></textarea>
      <div class="editor-actions">
        <button onclick="saveEdit()">💾 I-save</button>
        <button onclick="closeEditor()">❌ Isara</button>
      </div>
    </div>
  </main>
  <script src="js/system-loader.js"></script>
</body>
</html>
