<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP Martodosko — Admin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    body { background:#f0f0f1; color:#3c434a; }

    /* ✅ LAMAN — NASA KANAN KAPAG BUKAS ANG SIDEBAR */
    .content-wrapper {
      margin-left: 180px;
      padding: 0;
      min-height: 100vh;
      transition: margin-left 0.3s ease;
    }

    /* ✅ Kapag SARADO — sumusunod sa senyal mula sa sidebar */
    .content-wrapper.sidebar-closed {
      margin-left: 0;
    }

    /* ✅ DITO ILALAGAY ANG LAHAT NG PAHINA — KARGA NG system-loader.js */
    #page-content { min-height: 100vh; }

    /* ✅ LOADING */
    .loading-screen {
      padding: 80px 20px;
      text-align: center;
      color: #666;
    }
  </style>
    <!-- ✅ PANGALAWA: SYSTEM-LOADER — SIDEBAR + PAHINA PAGKARGA -->
  <script src="js/system-loader.js"></script>
</head>
<body>

  <!-- ✅ SIDEBAR — KARGAHIN NG system-loader.js -->
  <div id="sidebar-placeholder">
    <div style="padding: 20px;">⏳ Binabasa ang Menu...</div>
  </div>

  <!-- ✅ LAMAN — SUMUSUNOD SA SENYAL NG SIDEBAR -->
  <main class="content-wrapper" id="content-wrapper">
    <div id="page-content">
      <div class="loading-screen">
        <h2>⏳ Binabasa ang sistema...</h2>
      </div>
    </div>
  </main>

  <!-- ✅ UNA: LOGIC.JS — SESSION, MENU, GITHUB, LAHAT NG LOHIKA -->
  



  <!-- ✅ TANGGAPIN ANG SENYAL MULA SA SIDEBAR — TUMUTUGMA SA ESTILO -->
  <script>
    document.body.addEventListener('sidebarToggled', e => {
      const wrapper = document.getElementById('content-wrapper');
      if (wrapper) {
        wrapper.classList.toggle('sidebar-closed', e.detail.closed);
      }
    });
  </script>

</body>
</html>
