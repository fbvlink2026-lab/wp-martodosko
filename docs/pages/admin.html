<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP Martodosko — Admin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    body { background:#f0f0f1; color:#3c434a; }
    .content-wrapper { margin-left:180px; padding:25px; min-height:100vh; transition:margin-left 0.3s ease; }
    .content-wrapper.sidebar-hidden { margin-left:0; }
    h1 { font-size:24px; margin-bottom:20px; color:#1d2327; }
    h2 { font-size:18px; margin:16px 0 8px; color:#1d2327; }
    .card { background:white; border:1px solid #c3c4c7; border-radius:4px; padding:20px; margin-bottom:15px; }
    button { background:#007cba; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer; font-size:14px; transition:background 0.2s; }
    button:hover { background:#00a0d2; }
    button.secondary { background:#e5e5e5; color:#333; }
    table { width:100%; border-collapse:collapse; margin:15px 0; }
    th, td { padding:10px 12px; text-align:left; border-bottom:1px solid #ddd; }
    th { background:#fafafa; font-weight:600; }
    input, select, textarea { border:1px solid #c3c4c7; border-radius:4px; padding:8px; font-size:14px; }
    code { background:#f6f7f7; padding:2px 6px; border-radius:3px; font-family:Consolas,monospace; font-size:13px; }
  </style>
</head>
<body>
  <div id="sidebar-container"></div>
  <main class="content-wrapper" id="content-wrapper">
    <div id="page-content">
      <div style="padding:60px 20px;text-align:center;">
        <h2>⏳ Naghahanda...</h2>
        <p>Binabasa ang sistema.</p>
      </div>
    </div>
  </main>
  <script src="js/sidebar-logic.js"></script>
  <script src="js/system-loader.js"></script>
</body>
</html>
