<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WP Martodosko</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; }
    body { background:#f0f0f1; color:#3c434a; }

    /* ✅ SIDEBAR — LAGING NASA KALIWA — HINDI NA GUMAGALAW! */
    #sidebar-container {
      position:fixed; top:0; left:0; width:180px; height:100vh;
      background:#1d2327; color:#fff; overflow-y:auto; z-index:900;
      transition: transform 0.3s ease;
    }
    .sidebar-loading { padding:20px; text-align:center; color:#aaa; }

    /* ✅ LAMAN — NASA KANAN — ITO LANG ANG NAGBABAGO */
    .content-wrapper {
      margin-left:180px; padding:0; min-height:100vh;
      transition: margin-left 0.3s ease;
    }
    .content-wrapper.sidebar-hidden { margin-left:0; }

    /* ✅ ANG LALAGYAN NG DYNAMIC NA LAMAN */
    #page-content { min-height:100vh; }
  </style>
</head>
<body>

  <!-- ✅ SIDEBAR — LAGING NASA KALIWA — HINDI GUMAGALAW -->
  <div id="sidebar-container" style="display:none;">
    <div class="sidebar-loading">⏳ Binabasa ang Menu...</div>
  </div>

  <!-- ✅ LAMAN — DITO ILALAGAY ANG KAHIT ANONG PAHINA: login / dashboard / atbp. -->
  <main class="content-wrapper" id="content-wrapper">
    <div id="page-content">
      <div style="padding:60px 20px;text-align:center;">
        <h2>⏳ Binabasa ang sistema...</h2>
      </div>
    </div>
  </main>

  <!-- ✅ MGA SCRIPT -->
  <script src="js/logic.js"></script>
  <script>
  // ==================================================
  // 📌 ANG LALAGYAN NG LAHAT NG PAHINA
  // ==================================================
  const LALAGYAN = document.getElementById('page-content');
  const SIDEBAR = document.getElementById('sidebar-container');
  const WRAPPER = document.getElementById('content-wrapper');

  // ==================================================
  // 🔐 KUSANG ILAGAY ANG LOGIN O DASHBOARD
  // ==================================================
  async function ihandaAngSistema() {
    const NAKA_SETUP = localStorage.getItem('wp_gh_user');

    if (!NAKA_SETUP) {
      // ==============================================
      // ❌ HINDI PA NAKALOGIN → ILAGAY ANG LOGIN SA LALAGYAN
      // ==============================================
      SIDEBAR.style.display = 'none'; // ✅ Itago muna ang sidebar
      WRAPPER.style.marginLeft = '0'; // ✅ Palawakin ang laman

      await ikargaAngPahina('content/login.html');
      console.log('📋 Login inilalagay sa laman — HINDI PA NAKALOGIN');

      // ✅ BANTAYAN: Kapag nakapag-login na → BUMIBITAW ANG LOGIN AT PAPASOK ANG SIDEBAR
      const tagapagmasid = setInterval(() => {
        if (localStorage.getItem('wp_gh_user')) {
          clearInterval(tagapagmasid);
          ihandaAngSistema(); // ← Ulitin — ngayon may login na
        }
      }, 500);

    } else {
      // ==============================================
      // ✅ NAKALOGIN NA → BUMIBITAW ANG LOGIN → PAPASOK ANG SIDEBAR
      // ==============================================
      SIDEBAR.style.display = 'block'; // ✅ Ipakita ang sidebar
      WRAPPER.style.marginLeft = '180px'; // ✅ Iurong ang laman pakanan

      // ✅ IKABIT ANG SIDEBAR — LAGING NANDOON NA
      await ikabitSidebar();

      // ✅ ILAGAY ANG DASHBOARD — PUMAPALIT SA LUGAR NG LOGIN
      await ikargaAngPahina('content/dashboard.html');
      console.log('✅ Login bumitaw — Dashboard pumasok — Sidebar laging nandoon!');
    }
  }

  // ==================================================
  // 📄 KARANIWANG GAWAIN: KARGAHIN ANG PAHINA SA LALAGYAN
  // ==================================================
  async function ikargaAngPahina(daan) {
    try {
      const sagot = await fetch(daan);
      if (!sagot.ok) throw new Error(`Hindi makuha: ${daan}`);
      LALAGYAN.innerHTML = await sagot.text();

      // ✅ Patakbuhin ang mga script sa loob ng kargadong pahina
      LALAGYAN.querySelectorAll('script').forEach(luma => {
        const bago = document.createElement('script');
        bago.textContent = luma.textContent;
        Array.from(luma.attributes).forEach(a => bago.setAttribute(a.name, a.value));
        luma.replaceWith(bago);
      });
    } catch (mali) {
      LALAGYAN.innerHTML = `<div style="padding:30px;color:red;text-align:center;"><h3>❌ ${mali.message}</h3></div>`;
    }
  }

  // ==================================================
  // 📌 IKABIT ANG SIDEBAR
  // ==================================================
  async function ikabitSidebar() {
    try {
      const sagot = await fetch('sidebar.html');
      if (!sagot.ok) throw new Error('Hindi makuha ang sidebar');
      SIDEBAR.innerHTML = await sagot.text();

      // ✅ Patakbuhin ang mga script sa loob ng sidebar
      SIDEBAR.querySelectorAll('script').forEach(luma => {
        const bago = document.createElement('script');
        bago.textContent = luma.textContent;
        luma.replaceWith(bago);
      });
    } catch (mali) {
      SIDEBAR.innerHTML = `<div style="padding:15px;color:#ff8080;">❌ Sidebar: ${mali.message}</div>`;
    }
  }

  // ✅ SIMULAN LAHAT
  document.addEventListener('DOMContentLoaded', ihandaAngSistema);
  </script>

</body>
</html>
