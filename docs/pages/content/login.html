<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mag-login — WP Martodosko</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; }
    body { background:#f0f0f1; color:#3c434a; padding:40px 20px; }
    .container { max-width:480px; margin:0 auto; }
    h1 { font-size:24px; margin-bottom:30px; color:#1d2327; text-align:center; }
    .card { background:white; border:1px solid #c3c4c7; border-radius:4px; padding:25px; margin-bottom:20px; }
    h3 { font-size:16px; margin-bottom:15px; color:#1d2327; }
    p { color:#50575e; font-size:14px; margin-bottom:15px; line-height:1.5; }
    table { width:100%; border-collapse:collapse; margin:15px 0; }
    th { padding:10px; text-align:left; font-weight:500; color:#1d2327; width:140px; }
    td { padding:10px; }
    input { width:100%; padding:10px; border:1px solid #c3c4c7; border-radius:4px; font-size:15px; }
    input:focus { outline:none; border-color:#007cba; box-shadow:0 0 0 1px #007cba; }
    .btn { width:100%; padding:12px; border:none; border-radius:4px; font-size:15px; font-weight:500; cursor:pointer; transition:background 0.2s; }
    .btn-primary { background:#007cba; color:white; margin-top:10px; }
    .btn-primary:hover { background:#0090d0; }
    .btn-secondary { background:#e5e5e5; color:#3c434a; margin-top:10px; }
    .btn-secondary:hover { background:#dcdcde; }
    .notice { padding:12px; border-radius:4px; font-size:14px; margin-bottom:15px; }
    .notice.info { background:#e5f5fa; color:#004e69; border-left:4px solid #00a0d2; }
    .notice.warning { background:#fcf9e8; color:#664000; border-left:4px solid #dba617; }
    .notice.error { background:#fbeaea; color:#8a2424; border-left:4px solid #d63638; }
    .link { text-align:center; margin-top:15px; font-size:14px; }
    .link a { color:#007cba; text-decoration:none; }
    .link a:hover { text-decoration:underline; }
    #session-status { margin-bottom:15px; }
    .time-left { font-weight:600; color:#006509; }
  </style>
</head>
<body>
<div class="container">
  <h1>🔐 Mag-login</h1>

  <!-- ✅ SESSION STATUS CHECK -->
  <div id="session-status"></div>

  <div class="card" id="login-form">
    <h3>Ipasok ang Password</h3>
    <p>Ang password na ginamit mo noong inilagay ang iyong GitHub Token.</p>

    <table>
      <tr>
        <th>Password:</th>
        <td>
          <input type="password" id="login-password" placeholder="Ipasok ang iyong password">
        </td>
      </tr>
    </table>

    <button class="btn btn-primary" onclick="iSubmetLogin()">🔓 Mag-login</button>
  </div>

  <div class="link">
    <p>Wala pang akawnt? <a href="create.html">Gumawa ng Akawnt →</a></p>
  </div>
</div>

<!-- ✅ IKABIT ANG LOGIC.JS — PARA IISA ANG SISTEMA -->
<script src="../js/logic.js"></script>

<script>
// ==================================================
// ✅ SESSION CHECK — GAMIT ANG logic.js
// ==================================================
window.addEventListener('DOMContentLoaded', iSuriinAngSession);

function iSuriinAngSession() {
  const statusDiv = document.getElementById('session-status');
  const loginForm = document.getElementById('login-form');

  // ✅ GAMIT ANG logic.js — IISA ANG SISTEMA
  if (!window.iMayActiveSession || !iMayActiveSession()) {
    statusDiv.innerHTML = `<div class="notice warning">⚠️ Walang aktibong sesyon — kailangan mag-login o gumawa ng akawnt.</div>`;
    loginForm.style.display = 'block';
    return;
  }

  // ✅ MAY SESSION — KALKULAHIN ANG NATITIRANG ORAS
  const [oras, minuto] = iKuninNatitirangOras();
  const user = localStorage.getItem('wp_gh_user') || 'User';

  statusDiv.innerHTML = `
    <div class="notice info">
      ✅ Naka-login bilang <strong>${user}</strong> — may natitirang <span class="time-left">${oras} oras at ${minuto} minuto</span>
      <button onclick="iPalawiginSession()" style="margin-left:10px; padding:4px 8px; font-size:13px; cursor:pointer;">🔄 Palawigin</button>
      <button onclick="iLogout()" style="margin-left:5px; padding:4px 8px; font-size:13px; background:#fbeaea; color:#8a2424; border:none; border-radius:3px; cursor:pointer;">🚪 Labas</button>
    </div>`;

  // ✅ PUMUNTA AGAD KUNG MAY SESSION NA
  loginForm.style.display = 'block';
}

// ==================================================
// ✅ PAG SUBMIT NG LOGIN — TUGMA SA ENCRYPTION NG logic.js
// ==================================================
function iSubmetLogin() {
  const password = document.getElementById('login-password').value;
  if (!password) return alert('❌ Ipasok muna ang password.');

  // ✅ Gamitin ang parehong paraan ng pag-decrypt mula sa logic.js
  const STORAGE_MASTER_KEY = 'master-lock-key-only-local-not-sent-123!';
  const ep = localStorage.getItem('wp_enc_pass');
  if (!ep) {
    alert('❌ Wala pang akawnt — pupunta sa paggawa...');
    window.location.href = 'create.html';
    return;
  }

  // ✅ I-verify ang password gamit ang parehong key
  function deriveKey(p) { const s = 'wp-martodosko-2026-secret-salt'; return btoa(p + '|' + navigator.userAgent + '|' + s); }
  function decryptData(e, p) { try { const d = atob(e), k = deriveKey(p); let r=''; for(let i=0;i<d.length;i++) r += String.fromCharCode(d.charCodeAt(i) ^ k.charCodeAt(i % k.length)); return r; } catch { return null; } }

  const decrypted = decryptData(ep, STORAGE_MASTER_KEY);
  if (decrypted !== password) {
    return alert('❌ Mali ang password — subukan muli.');
  }

  // ✅ LUMIKHA NG SESSION — GAMIT ANG logic.js
  iLumikhaNgSession();

  alert('✅ Matagumpay na nakapasok!');
  window.location.href = './admin.html';
}

// ==================================================
// ✅ PALAWIGIN — GAMIT ANG logic.js
// ==================================================
function iPalawiginSession() {
  if (window.iPalawiginSession) iPalawiginSession();
  iSuriinAngSession();
}

// ==================================================
// ✅ LOGOUT — GAMIT ANG logic.js
// ==================================================
function iLogout() {
  if (window.iTapusinAngSession) iTapusinAngSession();
  alert('✅ Nakalabas na — tinapos na ang sesyon.');
  iSuriinAngSession();
}
</script>
</body>
</html>
